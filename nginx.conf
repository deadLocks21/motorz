# Sert le bundle web Flutter à la racine — le chemin doit correspondre au
# `--base-href` figé à la compilation (cf. Dockerfile).
#
# Ce conteneur ne voit jamais les requêtes de l'API : Traefik route `/api` et
# `/privacy-policy` vers le conteneur `motorz-api` avant d'arriver ici (cf.
# README, section « Déploiement web »).
#
# Les types MIME sont hérités du `include /etc/nginx/mime.types` du contexte
# http de l'image nginx. On ne redéclare **pas** de bloc `types { }` ici : dans
# un contexte server/location il remplacerait toute la table héritée au lieu de
# la compléter (et CanvasKit ne serait plus servi en `application/wasm`).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirections **relatives** (`Location: /…`). Par défaut nginx émet une URL
    # absolue reconstruite depuis son propre schéma et son port d'écoute :
    # derrière Traefik en TLS il annoncerait `http://motorz.dtfh.fr/…`, soit un
    # aller-retour en clair avant que le proxy ne repasse en HTTPS.
    absolute_redirect off;

    # main.dart.js pèse ~4 Mo brut : la compression n'est pas optionnelle.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Sonde de vivacité du conteneur (sert aussi au HEALTHCHECK de l'image).
    # Match exact : prioritaire sur le `location /` ci-dessous.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Fallback SPA : les routes profondes de go_router (/vehicles/<id>)
        # n'existent pas sur le disque, c'est le client qui les résout. Effet de
        # bord assumé : une URL inconnue renvoie l'app en 200, pas une 404.
        try_files $uri $uri/ /index.html;

        # `no-cache` = revalidation systématique, pas absence de stockage : le
        # navigateur garde les octets et nginx répond 304 via l'ETag tant que
        # rien n'a changé. On évite ainsi qu'un `main.dart.js` périmé reste
        # collé après un déploiement — Flutter ne versionne pas ce nom de
        # fichier — pour un surcoût réseau négligeable.
        add_header Cache-Control "no-cache" always;
        # Répété ici volontairement : nginx n'hérite les `add_header` du niveau
        # supérieur que si le niveau courant n'en déclare aucun.
        add_header X-Content-Type-Options "nosniff" always;
    }
}
