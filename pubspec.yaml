name: motorz
description: "Motorz — carnet de bord numérique de véhicules, offline-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State / DI
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^16.2.4

  # HTTP
  dio: ^5.9.0

  # Offline-first : base locale (source de vérité) + synchro
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7+1
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^6.1.0
  synchronized: ^3.1.0

  # Préférences & session
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Divers
  uuid: ^4.5.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  file_picker: ^9.0.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
