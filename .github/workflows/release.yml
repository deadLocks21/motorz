# Workflow de release Motorz, déclenché sur push d'un tag `v*`.
#
# Le tag est poussé par la CI GitLab (semantic-release, cf. .gitlab-ci.yml) puis
# mirroré vers GitHub, ce qui déclenche ce workflow.
#
# Pipeline "fail-fast au build, atomique à la publish/release" :
#
#   1) prepare         Calcule la version (depuis le tag ou pubspec.yaml).
#   2) build-android   AAB + APK universel signés (artifacts, pas encore publiés).
#      build-macos     .pkg signé Mac App Store (artifact, pas encore publié).
#      build-windows   .zip autonome du dossier Release (artifact).
#      build-linux     AppImage x86_64 (artifact).
#      build-updater   CLI installateur/auto-updater desktop (Win + Linux).
#   3) build-gate      Sentinelle : vérifie que les builds d'app sont verts.
#   4) publish-android Upload sur le Play Store, piste "internal".
#      publish-macos   Upload sur TestFlight (les testeurs internes du groupe
#                      "Motorz Internal" reçoivent le build automatiquement).
#   5) release         Crée la GitHub Release avec l'AAB + l'APK + le .pkg +
#                      le .zip Windows + l'AppImage + les 2 binaires updater.
#
# CANAL DESKTOP (Windows/Linux) : pas de store → distribution + auto-update via
# les GitHub Releases. L'utilisateur télécharge l'updater une fois (tool/updater),
# qui met ensuite à jour l'app ET lui-même (cf. tool/updater/README.md). macOS
# garde son canal store (Mac App Store / TestFlight). build-windows/linux sont
# dans le gate (atomique) ; build-updater conditionne la release, pas les stores.
# AUTRES CIBLES (iOS/App Store, Web) : hors pipeline pour l'instant
# (cf. BRIEF §12 et §13, étape 14 « Élargissement des cibles »).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64        keystore upload (.jks) encodé base64
#   ANDROID_KEYSTORE_PASSWORD      mot de passe du keystore
#   ANDROID_KEY_ALIAS              alias de la clé
#   ANDROID_KEY_PASSWORD           mot de passe de la clé
#   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  JSON du compte de service Google Play
#   APP_STORE_CONNECT_KEY_IDENTIFIER     Key ID de la clé API App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID          Issuer ID du compte App Store Connect
#   APP_STORE_CONNECT_PRIVATE_KEY        contenu du .p8 de la clé API
#   CERTIFICATE_PRIVATE_KEY              clé privée du cert Apple Distribution
#   MAC_INSTALLER_CERTIFICATE_P12_BASE64 cert "3rd Party Mac Developer Installer" (.p12 base64)
#   MAC_INSTALLER_CERTIFICATE_PASSWORD   mot de passe du .p12 installer
#   SIGNOZ_INGESTION_KEY           clé d'ingestion Signoz (optionnelle — vide =
#                                  app en ConsoleLogger, pas de remontée Signoz)
# Les 6 secrets Apple sont account-wide (compte fr.dtfh, déjà utilisés par
# kidflix/songbook) — recopier les mêmes valeurs, rien à régénérer.
#
# Pré-requis Play Console : l'app `fr.dtfh.motorz` doit exister dans la console
# et un premier AAB peut devoir être uploadé manuellement avant que l'API
# accepte les publications automatiques sur la piste internal.
# Pré-requis App Store Connect : app Motorz (Apple ID 6773623419, bundle
# `fr.dtfh.motorz`, plateforme macOS) créée + groupe TestFlight interne
# "Motorz Internal". Le provisioning profile Mac App Store est généré
# automatiquement au premier build par `fetch-signing-files --create`.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Config Signoz partagée, injectée dans le binaire via `--dart-define` à la
# compilation (cf. lib/infrastructure/providers/logger_providers.dart qui lit
# `String.fromEnvironment('SIGNOZ_INGEST_URL')`). Sans ces valeurs, l'app
# retombe sur ConsoleLoggerService → pas de remontée Signoz côté users.
env:
  SIGNOZ_INGEST_URL: "https://ingest.eu.signoz.cloud:443/v1/logs"
  SIGNOZ_ENV: "production"

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extrait la version depuis le tag (ou pubspec.yaml)
        # Tag `v1.2.3` → 1.2.3. Pour `workflow_dispatch` (lancement manuel
        # sans tag), on retombe sur la version de `pubspec.yaml`.
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD ANDROID — Compilation + signature + upload artifact (pas de publish)
  # ═══════════════════════════════════════════════════════════════════════

  build-android:
    name: Build Android (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PACKAGE_NAME: "fr.dtfh.motorz"
      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Décoder le keystore upload
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"

      - name: Écrire android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          EOF

      - run: flutter pub get

      - name: Compute build number from Google Play
        id: build-number
        run: |
          LATEST_BUILD=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials "@env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" \
            --tracks production beta alpha internal 2>/dev/null || echo 0)
          BUILD_NUMBER=$((${LATEST_BUILD:-0} + 1))
          echo "Next Android build number: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build App Bundle (.aab)
        env:
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION" \
            --build-number="${{ steps.build-number.outputs.build_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV" \
            --dart-define=APP_VERSION="$VERSION+${{ steps.build-number.outputs.build_number }}"

      - name: Build APK (.apk)
        # APK universel attaché à la GitHub Release pour install directe /
        # sideload. Le Play Store reçoit l'AAB (cf. job publish-android) ;
        # l'APK ne sert qu'à la distribution hors store. Mêmes `--dart-define`.
        env:
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ steps.build-number.outputs.build_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV" \
            --dart-define=APP_VERSION="$VERSION+${{ steps.build-number.outputs.build_number }}"

      - name: Upload AAB + APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorz-android
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD macOS — Compilation + signature + packaging .pkg (pas de publish)
  # ═══════════════════════════════════════════════════════════════════════

  build-macos:
    name: Build macOS (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      MAC_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 }}
      MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
      BUNDLE_ID: "fr.dtfh.motorz"
      APP_STORE_APPLE_ID: "6773623419"
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Initialize keychain
        run: keychain initialize

      - name: Fetch Mac App Store signing files (create if missing)
        run: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type MAC_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add Mac App Distribution certificate to keychain
        run: keychain add-certificates

      - name: Add Mac Installer Distribution certificate to keychain
        # Cert installer account-wide, injecté depuis secret base64 (pas généré
        # par fetch-signing-files qui ne couvre que les certs liés à un bundle ID).
        run: |
          INSTALLER_P12="$RUNNER_TEMP/mac_installer.p12"
          echo "$MAC_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$INSTALLER_P12"
          keychain add-certificates \
            -c "$INSTALLER_P12" \
            --certificate-password=@env:MAC_INSTALLER_CERTIFICATE_PASSWORD

      - name: Verify keychain contents (debug)
        # 2 identités obligatoires : "Apple Distribution" (signe le .app) +
        # "3rd Party Mac Developer Installer" (signe le .pkg).
        run: |
          security find-identity -v -p basic
          N=$(security find-identity -v -p basic | tail -1 | grep -oE '[0-9]+' | head -1)
          if [ "${N:-0}" -lt 2 ]; then
            echo "ERROR: expected at least 2 identities, got ${N:-0}"
            exit 1
          fi

      - name: Set up code signing on macOS Xcode project
        run: xcode-project use-profiles --project macos/Runner.xcodeproj

      - run: flutter pub get

      - name: Cache CocoaPods (macOS)
        uses: actions/cache@v4
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-macos-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-macos-${{ runner.os }}-

      - name: Install CocoaPods dependencies (macOS)
        run: |
          cd macos
          pod install

      - name: Compute build number from App Store Connect (macOS)
        # `--platform MAC_OS` CRUCIAL : build number macOS séparé d'iOS
        # malgré Universal Purchase.
        id: build-number
        run: |
          LATEST_BUILD=$(app-store-connect get-latest-build-number \
            "$APP_STORE_APPLE_ID" \
            --platform MAC_OS)
          BUILD_NUMBER=$((LATEST_BUILD + 1))
          echo "Next macOS build number: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build macOS release
        env:
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build macos --release \
            --build-name="$VERSION" \
            --build-number="${{ steps.build-number.outputs.build_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV" \
            --dart-define=APP_VERSION="$VERSION+${{ steps.build-number.outputs.build_number }}"

      - name: Package .app into signed .pkg
        # productbuild (création) + productsign (signature) séparés pour avoir
        # un message d'erreur précis. `--timestamp=none` évite l'appel
        # timestamp.apple.com qui peut hang. `< /dev/null` ferme stdin.
        run: |
          set -euo pipefail

          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          fi

          INSTALLER_IDENTITY=$(security find-identity -v -p basic \
            | grep "3rd Party Mac Developer Installer" \
            | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+[A-F0-9]+[[:space:]]+"(.*)"$/\1/')
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "ERROR: no installer identity found"
            security find-identity -v
            exit 1
          fi

          PKG_NAME="motorz-${VERSION}-${{ steps.build-number.outputs.build_number }}.pkg"
          UNSIGNED_PKG="$RUNNER_TEMP/unsigned.pkg"

          productbuild --component "$APP_PATH" /Applications "$UNSIGNED_PKG"
          productsign \
            --sign "$INSTALLER_IDENTITY" \
            --timestamp=none \
            "$UNSIGNED_PKG" "$PKG_NAME" < /dev/null
          pkgutil --check-signature "$PKG_NAME"
          echo "PKG_PATH=$PWD/$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorz-macos
          path: ${{ env.PKG_PATH }}
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD WINDOWS — Compilation desktop + zip autonome (pas de publish store)
  # ═══════════════════════════════════════════════════════════════════════

  build-windows:
    name: Build Windows (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # pdfx télécharge/compile pdfium via un CMake imbriqué dont le template
      # déclare cmake_minimum_required(VERSION 2.8.12). CMake 4 a supprimé la
      # compat < 3.5 ; l'env var (héritée par l'invocation cmake imbriquée)
      # relâche ce minimum. Cf. pdfx/windows/DownloadProject.CMakeLists.cmake.in.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        env:
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build windows --release `
            --build-name="$env:VERSION" `
            --build-number="${{ github.run_number }}" `
            --dart-define=SIGNOZ_INGEST_URL="$env:SIGNOZ_INGEST_URL" `
            --dart-define=SIGNOZ_INGESTION_KEY="$env:SIGNOZ_INGESTION_KEY" `
            --dart-define=SIGNOZ_ENV="$env:SIGNOZ_ENV" `
            --dart-define=APP_VERSION="$env:VERSION+${{ github.run_number }}"

      - name: Zip Windows build output
        # Le .exe dépend des DLL Flutter et du dossier `data/` côte à côte
        # → on zippe tout le dossier Release pour une archive autonome.
        shell: pwsh
        run: |
          $zipName = "motorz-windows-$env:VERSION-${{ github.run_number }}.zip"
          $sourceDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $sourceDir)) {
            Write-Error "Build output directory not found: $sourceDir"
            exit 1
          }
          Compress-Archive -Path "$sourceDir/*" -DestinationPath $zipName
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorz-windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD LINUX — Compilation desktop + AppImage (pas de publish store)
  # ═══════════════════════════════════════════════════════════════════════

  build-linux:
    name: Build Linux (${{ needs.prepare.outputs.version }})
    needs: prepare
    # ubuntu-22.04 (glibc 2.35) plutôt que ubuntu-latest (24.04 / glibc 2.39)
    # pour rester compatible avec des distros utilisateur un peu plus anciennes.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Filet CMake 4 : certains plugins desktop déclarent encore un
      # cmake_minimum_required < 3.5 (supprimé par CMake 4). L'env var relâche
      # ce minimum pour toutes les invocations cmake (cf. build-windows / pdfx).
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter Linux desktop build dependencies
        # Dépendances GTK standard de Flutter desktop. Motorz n'utilise pas
        # media_kit → pas de libasound2-dev / libmpv-dev (contrairement à kidflix).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            clang \
            cmake \
            pkg-config \
            liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - name: Build Linux release
        env:
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build linux --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV" \
            --dart-define=APP_VERSION="$VERSION+${{ github.run_number }}"

      - name: Assemble AppDir
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:${LD_LIBRARY_PATH}"
          cd "$HERE/usr/bin" && exec ./motorz "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/motorz.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Motorz
          Comment=Carnet de bord de vos véhicules
          Exec=motorz
          Icon=motorz
          Categories=Utility;
          Terminal=false
          StartupWMClass=fr.dtfh.motorz
          EOF

          cp assets/icon/app_icon.png "$APPDIR/motorz.png"

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        # `--appimage-extract-and-run` : appimagetool est lui-même un AppImage
        # qui requiert FUSE2 pour s'auto-monter. Sur GHA, FUSE n'est pas dispo.
        run: |
          APPIMAGE_NAME="Motorz-${VERSION}-${{ github.run_number }}-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "$APPIMAGE_NAME"
          echo "APPIMAGE_NAME=$APPIMAGE_NAME" >> "$GITHUB_ENV"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorz-linux
          path: ${{ env.APPIMAGE_NAME }}
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  # UPDATER — Binaire installateur/launcher/auto-updater (Windows + Linux).
  # Petit CLI Dart (tool/updater), indépendant des builds d'app : attaché à
  # la release pour que l'utilisateur le télécharge une seule fois, puis il
  # se met à jour seul (app ET updater).
  # ───────────────────────────────────────────────────────────────────────

  build-updater:
    name: Build Updater (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            out: motorz-updater-windows.exe
            artifact: motorz-updater-windows
          - os: ubuntu-22.04
            label: Linux
            out: motorz-updater-linux
            artifact: motorz-updater-linux

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.5"

      - name: Resolve updater deps
        working-directory: tool/updater
        run: dart pub get

      # Sous-système console : l'install affiche ses prompts ; les lancements
      # quotidiens passent par un wrapper caché (VBS Windows / .desktop Linux).
      - name: Compile updater
        working-directory: tool/updater
        run: dart compile exe bin/motorz_updater.dart -o "${{ matrix.out }}"

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tool/updater/${{ matrix.out }}
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD GATE — Sentinelle qui valide que les builds sont verts
  # ═══════════════════════════════════════════════════════════════════════

  build-gate:
    name: All builds passed
    needs: [build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "✓ All platform builds succeeded — proceeding to store uploads"

  # ═══════════════════════════════════════════════════════════════════════
  # PUBLISH — Upload store (déclenché après build-gate uniquement)
  # ═══════════════════════════════════════════════════════════════════════

  publish-android:
    name: Publish Android to Play Store
    needs: [prepare, build-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: motorz-android
          path: artifacts/

      - name: Publish to Play Store (internal track)
        run: |
          AAB_PATH=$(find artifacts -type f -name '*.aab' | head -1)
          echo "Uploading: $AAB_PATH"
          google-play bundles publish \
            --credentials "@env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" \
            --bundle "$AAB_PATH" \
            --track internal \
            --release-notes "@file:release_notes_android.json"

  publish-macos:
    name: Publish macOS to TestFlight
    needs: [prepare, build-gate]
    # 120 min de timeout : le processing Apple pour les .pkg macOS est souvent
    # plus lent que pour les .ipa.
    runs-on: macos-15
    timeout-minutes: 120

    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_MAX_FIND_BUILD_WAIT: "90"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: motorz-macos
          path: artifacts/

      - name: Publish to TestFlight (internal beta group, macOS)
        run: |
          WHATS_NEW=$(jq -r '.[] | select(.language=="fr-FR") | .text' release_notes.json)
          PKG_PATH=$(find artifacts -type f -name '*.pkg' | head -1)
          echo "Uploading: $PKG_PATH"
          # NB : pas de `--beta-group`. "Motorz Internal" est un groupe INTERNE :
          # l'API App Store Connect refuse l'assignation explicite d'un build à un
          # groupe interne ("Cannot add internal group to a build"). Les testeurs
          # internes reçoivent automatiquement tout build traité. `--beta-group`
          # n'est à utiliser que pour des groupes EXTERNES.
          app-store-connect publish \
            --path "$PKG_PATH" \
            --testflight \
            --expire-build-submitted-for-review \
            --locale fr-FR \
            --whats-new "$WHATS_NEW" \
            --max-find-build-wait 90

  # ═══════════════════════════════════════════════════════════════════════
  # GITHUB RELEASE — AAB + .pkg attachés, après publishes verts
  # ═══════════════════════════════════════════════════════════════════════

  release:
    name: Create GitHub Release
    needs: [prepare, publish-android, publish-macos, build-windows, build-linux, build-updater]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        run: |
          BODY=$(jq -r '.[] | select(.language=="fr-FR") | .text' release_notes.json)

          ASSETS=()
          echo "Releasing assets:"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "  - $f"
            ASSETS+=("$f")
          done < <(find artifacts -type f \( \
            -name '*.aab' -o -name '*.apk' -o -name '*.pkg' \
            -o -name '*.zip' -o -name '*.AppImage' \
            -o -name 'motorz-updater-windows.exe' -o -name 'motorz-updater-linux' \
            \) | sort)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "ERROR: no release assets found"
            exit 1
          fi

          # Tag name : `v<version>` si on est sur un tag, sinon nom synthétique
          # avec run_number pour éviter toute collision avec un tag git existant
          # (cas workflow_dispatch, pour tester le pipeline sans tagger).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="dispatch-v${VERSION}-${{ github.run_number }}"
          fi
          echo "Release tag: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            --title "Motorz v$VERSION" \
            --notes "$BODY" \
            "${ASSETS[@]}"
